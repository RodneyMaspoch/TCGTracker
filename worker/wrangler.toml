name = "tcgtracker"
main = "src/index.js"
compatibility_date = "2026-09-29"

# Serves everything in ../public (the existing PWA frontend — index.html,
# lorcana.html, pokemon.html, pwa-boot.js, sw.js, manifest.json, images,
# icons — all untouched) directly, with no build step. Any request that
# doesn't match a file in there (e.g. /api/*) falls through to this
# Worker's fetch handler in src/index.js.
[assets]
directory = "../public"
binding = "ASSETS"

# 2026-10-05: this Cron Trigger is now just a watchdog — the real poll
# loop moved to the Ticker Durable Object's self-re-arming alarm (see
# ticker-do.js), which runs every ~15s. Cron Triggers can't fire faster
# than once a minute on any Workers plan, which is exactly why the loop
# was moved off of this mechanism; this trigger now only pings the DO to
# restart the alarm chain if it ever stops. See index.js's scheduled().
# Free plan cap: 5 Cron Triggers per ACCOUNT (not per Worker) — this uses 1.
[triggers]
crons = ["* * * * *"]

# Durable Object binding for the 15s ticker loop (see ticker-do.js). The
# `migrations` block below is Cloudflare's required bookkeeping for DO
# classes across deploys — unrelated to the D1 .sql files in
# worker/migrations/, which are a separate system entirely. new_sqlite_classes
# (not new_classes) is deliberate: the SQLite storage backend for Durable
# Objects is the one available on the Workers Free plan.
[[durable_objects.bindings]]
name = "TICKER"
class_name = "Ticker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ticker"]

# How many ticks between each slow-lane advance. 2026-10-05: a "tick" is
# now ~15s (see ticker-do.js), not 1 minute — default 3 means the
# 12-listing MTG+Lorcana slow lane completes a full cycle every ~9 minutes
# now, down from ~36 minutes. Raise this to check less often (lower total
# request volume to retailers), lower it to check more often (closer to,
# but still slower than, the fast lane).
[vars]
SLOW_LANE_EVERY_N_TICKS = "3"
VAPID_PUBLIC_KEY = "BNivxQj3iFv4bbyOGjD7mMIloCvMCvnHd5CFTPfSKi5jNnAm_73DphOqwR3f39hPDMbnAvma6BapE5wKj8ngz0U"
VAPID_SUBJECT = "mailto:stuffiliked@gmail.com"

# 2026-10-10: Nintendo's own store search (nintendo.com/us/search) runs on
# Algolia — see worker/src/nintendo-algolia.js's header comment for the
# full story. This app/key pair is the exact public, search-only
# credential nintendo.com ships to every visitor's browser on every page
# load (found via the browser's own DevTools Network tab, together with
# the user) — there is nothing secret about it, which is why it's a plain
# [vars] entry here and not a `wrangler secret put`. If Nintendo ever
# rotates this key, update it here — no code change needed.
NINTENDO_ALGOLIA_APP_ID = "U3B6GR4UA3"
NINTENDO_ALGOLIA_API_KEY = "a29c6927638bfd8cee23993e51e721c9"

# D1 database binding. Run `wrangler d1 create tcgtracker-db` once, then
# paste the database_id it prints below (see worker/README.md for the full
# step-by-step). Left blank here on purpose — wrangler will refuse to
# deploy until it's filled in, which is the point: it stops you from
# accidentally deploying against a database that doesn't exist yet.
[[d1_databases]]
binding = "DB"
database_name = "tcgtracker-db"
database_id = "a9b101db-55d3-4d53-a41c-5da5d161662a"

# Secrets (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT) are NOT set
# here — .toml files are meant to be committed to git, and these are
# credentials. Set them with `wrangler secret put VAPID_PUBLIC_KEY` etc.
# (see worker/README.md). The Node version's existing VAPID keys (from
# `npm run generate-vapid`) work as-is here — no need to regenerate them.
