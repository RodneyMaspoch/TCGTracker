<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCGTracker</title>
<meta name="theme-color" content="#08060e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>TCGTRACKER</div>
    <button id="notifyBtn" class="btn-notify">Enable alerts</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-game="pokemon">Pokémon</button>
    <button class="tab-btn" data-game="mtg">MTG</button>
    <button class="tab-btn" data-game="lorcana">Lorcana</button>
  </nav>

  <section id="drawingBanner" class="drawing-banner" hidden></section>

  <main id="productGrid" class="grid"></main>

  <section class="events">
    <h2>Recent alerts</h2>
    <div id="eventsList" class="events-list"></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
