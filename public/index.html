<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#08060e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;background:#08060e;color:#e9e6df;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty;overflow-x:hidden;--tcg-push-accent:#b0ff36;--tcg-push-accent-ink:#14210a}
a{color:#b0ff36;text-decoration:none}a:hover{color:#cbff7a}
::-webkit-scrollbar{width:0;height:0}
@keyframes sw-blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sw-ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.sw-ticker-wrap:hover .sw-ticker-track{animation-play-state:paused}
.tt-slider{display:flex!important;grid-template-columns:none!important;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tt-slider::-webkit-scrollbar{height:6px}
.tt-slider::-webkit-scrollbar-thumb{background:rgba(233,230,223,.2);border-radius:999px}
.tt-slider>*{flex:0 0 262px;width:262px;scroll-snap-align:start}
.tt-slider.tt-sm>*{flex-basis:190px;width:190px}
.tt-slider.tt-lg>*{flex-basis:285px;width:285px}
</style>
<style id="dc-hover-styles"></style>
</head>
<body data-game="mtg">
<div id="dc-root"></div>
<template id="dc-template">



<sc-if value="{{ hist }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeHistory }}" style="position:fixed;inset:0;z-index:60;background:rgba(4,3,9,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:26px">
<div onClick="{{ stop }}" style="width:min(760px,100%);background:#100b1b;border:1px solid rgba(233,230,223,.14);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6)">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px 0">
<div>
<div style="display:flex;align-items:center;gap:8px">
<div onClick="{{ openSearch }}" title="Search" style="cursor:pointer;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(233,230,223,.2);display:flex;align-items:center;justify-content:center" style-hover="border-color:#b0ff36">
<svg width="16" height="17" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.8" style="color:#e9e6df"></circle><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:#e9e6df"></line></svg>
</div>
<div style="position:relative">
<div onClick="{{ toggleMenu }}" title="Menu" style="cursor:pointer;width:36px;height:36px;border-radius:50%;border:1px solid {{ menuBd }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
<span style="width:15px;height:1.6px;background:{{ menuFg }};display:block"></span>
<span style="width:15px;height:1.6px;background:{{ menuFg }};display:block"></span>
<span style="width:15px;height:1.6px;background:{{ menuFg }};display:block"></span>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:46px;right:0;z-index:75;min-width:212px;background:#100b1b;border:1px solid rgba(233,230,223,.18);border-radius:16px;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)">
<sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="5">
<a href="{{ m.href }}" onClick="{{ closeMenu }}" style="display:block;text-decoration:none;font-family:'Roboto Mono',monospace;font-size:14px;color:{{ m.fg }};padding:11px 14px;border-radius:10px;white-space:nowrap" style-hover="background:rgba(255,255,255,.06)">{{ m.label }}</a>
</sc-for>
<div onClick="{{ armAllFromMenu }}" style="cursor:pointer;text-align:center;margin-top:8px;background:#b0ff36;color:#14210a;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;padding:11px 16px;border-radius:999px;white-space:nowrap">ARM ALL</div>
</div>
</sc-if>
</div>
<span style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.62)">{{ histRetailer }} · LAST 30 DAYS</span>
</div>
<div style="font-size:26px;font-weight:900;font-stretch:112%;letter-spacing:-.02em;color:#fff;margin-top:9px;line-height:1.1">{{ histName }}</div>
</div>
<div onClick="{{ closeHistory }}" style="cursor:pointer;flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(233,230,223,.2);display:flex;align-items:center;justify-content:center;font-size:15px;color:#e9e6df" style-hover="border-color:#b0ff36;color:#b0ff36">✕</div>
</div>

<div style="display:flex;gap:26px;flex-wrap:wrap;padding:18px 22px 0">
<sc-for list="{{ histStats }}" as="st" hint-placeholder-count="4">
<div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.55)">{{ st.k }}</div>
<div style="font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:22px;color:{{ st.c }};line-height:1.2">{{ st.v }}</div>
</div>
</sc-for>
</div>

<div style="padding:16px 22px 0">
<div onMouseMove="{{ histMove }}" onMouseLeave="{{ histLeave }}" style="position:relative;cursor:crosshair">
<svg viewBox="0 0 640 200" width="100%" height="200" preserveAspectRatio="none" style="display:block;pointer-events:none">
<polyline points="{{ histArea }}" fill="{{ histFill }}" stroke="none"></polyline>
<polyline points="{{ histLine }}" fill="none" stroke="{{ histColor }}" stroke-width="2"></polyline>
<line x1="0" y1="{{ histMsrpY }}" x2="640" y2="{{ histMsrpY }}" stroke="#a855f7" stroke-width="1" stroke-dasharray="5 5"></line>
</svg>
<sc-if value="{{ histHover }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:0;bottom:0;width:1px;background:rgba(233,230,223,.45);pointer-events:none;left:{{ histHoverX }}"></div>
<div style="position:absolute;width:11px;height:11px;border-radius:50%;background:{{ histColor }};border:2px solid #100b1b;pointer-events:none;transform:translate(-50%,-50%);left:{{ histHoverX }};top:{{ histHoverY }}"></div>
<div style="position:absolute;pointer-events:none;transform:translate(-50%,-140%);left:{{ histHoverX }};top:{{ histHoverY }};background:#0c0817;border:1px solid rgba(233,230,223,.24);border-radius:10px;padding:7px 11px;white-space:nowrap;text-align:center">
<div style="font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;color:{{ histColor }};line-height:1">{{ histHoverPrice }}</div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.62);margin-top:4px">{{ histHoverDay }}</div>
</div>
</sc-if>
</div>
<div style="display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.55);margin-top:6px">
<span>{{ histStartDate }}</span><span style="color:#a855f7">— — MSRP {{ histMsrp }}</span><span>{{ histEndDate }}</span>
</div>
</div>

<div style="padding:18px 22px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<div onClick="{{ histToggle }}" style="cursor:pointer;background:{{ histBtnBg }};color:{{ histBtnFg }};border:1px solid #b0ff36;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;padding:11px 24px;border-radius:999px">{{ histBtnLabel }}</div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.62)">{{ histNote }}</div>
</div>
</div>
</div>
</sc-if>

<div style="position:relative;background:
radial-gradient(62% 40% at 88% -6%,rgba(168,85,247,.30) 0%,transparent 62%),
radial-gradient(50% 34% at 2% 4%,rgba(176,255,54,.13) 0%,transparent 60%),
#08060e">
<sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;inset:0;z-index:80;background:rgba(4,3,9,.94);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:34px 40px">
<div style="display:flex;align-items:center;gap:18px;max-width:900px;width:100%;margin:0 auto;padding-bottom:22px;border-bottom:1px solid rgba(233,230,223,.2)">
<svg width="22" height="22" viewBox="0 0 20 20" fill="none" style="flex:none"><circle cx="8.5" cy="8.5" r="6" stroke="#b0ff36" stroke-width="1.8"></circle><line x1="13" y1="13" x2="18" y2="18" stroke="#b0ff36" stroke-width="1.8" stroke-linecap="round"></line></svg>
<input value="{{ q }}" onChange="{{ setQ }}" autoFocus="{{ true }}" placeholder="Search sets, precons, Secret Lair…" style="flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-family:Archivo,sans-serif;font-weight:700;font-stretch:108%;font-size:34px">
<div onClick="{{ closeSearch }}" style="cursor:pointer;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(233,230,223,.2);display:flex;align-items:center;justify-content:center;color:#e9e6df;font-size:16px" style-hover="border-color:#b0ff36;color:#b0ff36">✕</div>
</div>

<div style="max-width:900px;width:100%;margin:0 auto;overflow:auto;padding-top:26px">
<sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
<div style="padding:22px 0;border-bottom:1px solid rgba(233,230,223,.1)">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap">
<div style="font-size:20px;font-weight:700;font-stretch:108%;color:#fff">{{ r.name }}</div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.55)">MSRP {{ r.msrp }}</div>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
<sc-for list="{{ r.quotes }}" as="qt" hint-placeholder-count="3">
<div style="display:flex;align-items:baseline;gap:10px;background:{{ qt.bg }};border:1px solid {{ qt.bd }};border-radius:999px;padding:9px 16px">
<span style="font-family:'Roboto Mono',monospace;font-size:14px;color:{{ qt.labelFg }};white-space:nowrap">{{ qt.src }}</span>

</div>
</sc-for>
</div>
</div>
</sc-for>
<sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
<div style="font-size:16px;color:rgba(233,230,223,.6);padding:26px 0">No tracked products match that. Try a set name or product type.</div>
</sc-if>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.45);line-height:1.7;padding:26px 0 8px">PRICES SHOWN ARE FROM THE LISTED RETAILER DIRECTLY · NO TCGPLAYER OR THIRD-PARTY MARKET DATA TRACKED YET</div>
</div>
</div>
</sc-if>

<div style="position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27220%27%20height=%27220%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.85%27%20numOctaves=%274%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27220%27%20height=%27220%27%20filter=%27url%28%23n%29%27%20opacity=%270.5%27/%3E%3C/svg%3E);background-size:220px 220px"></div>

<div class="sw-ticker-wrap" style="background:#100b1b;overflow:hidden;padding:8px 0;border-bottom:1px solid rgba(168,85,247,.28)">
<div class="sw-ticker-track" style="display:flex;width:max-content;animation:sw-ticker 34s linear infinite;animation-duration:{{ tickerDur }}">
<sc-for list="{{ tickerLoop }}" as="lap" hint-placeholder-count="2">
<div style="display:flex;gap:34px;flex:0 0 auto;width:max-content;padding-right:34px">
<sc-for list="{{ tickerItems }}" as="t" hint-placeholder-count="3">
<a href="{{ t.url }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(233,230,223,.62);white-space:nowrap" style-hover="color:#b0ff36">
<span style="color:{{ t.tone }}">{{ t.glyph }}</span>{{ t.label }}
</a>
</sc-for>
</div>
</sc-for>
</div>
</div>

// Builds one ticker marquee item straight from an ALL_DEALS entry's own
// (live-patched) fields — see the comment on tickerItems in renderVals.
function dealTicker(dealId, glyph, tone) {
  const d = ALL_DEALS.find((x) => x.id === dealId);
  if (!d) return { glyph, tone, label: '', url: '' };
  const bits = [d.name.toUpperCase(), d.stock];
  if (d.delta && d.delta !== 'NO DISCOUNT' && d.delta !== 'NO MSRP PUBLISHED') bits.push(d.delta);
  return { glyph, tone, label: bits.join(' · ') + ' — ' + d.retailer, url: d.url };
}

  pager(total, per, page, key) {
    const pages = Math.ceil(total / per) || 1;
    const cur = Math.min(page, pages - 1);
    return {
      multi: pages > 1,
      start: cur * per,
      prev: () => this.setState({ [key]: (cur - 1 + pages) % pages }),
      next: () => this.setState({ [key]: (cur + 1) % pages }),
      dots: Array.from({ length: pages }, (_, i) => ({
        n: String(i + 1),
        pick: () => this.setState({ [key]: i }),
        bg: i === cur ? LIME : 'transparent',
        fg: i === cur ? INK : DIM,

  historyVals() {
    const d = ALL_DEALS.find(x => x.id === this.state.history);
    if (!d) return { hist: false };
    const s = d.series, min = Math.min(...s), max = Math.max(...s), r = (max - min) || 1;
    const pad = (max - min) * 0.25 || max * 0.06;
    const lo = min - pad, hi = max + pad, span = hi - lo;
    const y = v => (190 - (v - lo) / span * 180).toFixed(1);
    const pts = s.map((v, i) => `${(i / (s.length - 1) * 640).toFixed(1)},${y(v)}`);
    const msrpNum = parseFloat(d.msrp.replace(/[^0-9.]/g, ''));
    const on = !!this.state.armed[d.id];
    return {
      hist: true,
      histName: d.name,
      histRetailer: d.retailer,
      histMark: d.mark, histMarkBg: d.markBg, histMarkFg: d.markFg,
      histColor: d.under ? LIME : PURPLE,
      histFill: d.under ? 'rgba(176,255,54,.12)' : 'rgba(168,85,247,.14)',
      histLine: pts.join(' '),
      histArea: ['0,200', ...pts, '640,200'].join(' '),
      histMsrp: d.msrp,
      histStartDate: this.dayLabel(30),
      histEndDate: this.dayLabel(0),
      histMsrpY: y(msrpNum),
      histStats: [
        { k: 'NOW', v: d.price, c: d.under ? LIME : PURPLE },
        { k: 'MSRP', v: d.msrp, c: '#fff' },
        { k: '30D LOW', v: '$' + Math.min(...s).toFixed(2), c: LIME },
        { k: '30D HIGH', v: '$' + Math.max(...s).toFixed(2), c: RED },
        { k: 'VS MSRP', v: d.delta, c: d.under ? LIME : PURPLE },
      ],
      histNote: on ? 'ALERTS ON AT OR BELOW $' + this.targetOf(d) + ' — PUSH · SMS · EMAIL' : 'SNAPSHOT ONLY — 30-DAY HISTORY NEEDS A PRICE-TRACKING INTEGRATION (NOT YET WIRED UP)',
      histMove: (ev) => {
        const r = ev.currentTarget.getBoundingClientRect();
        const i = Math.round(((ev.clientX - r.left) / r.width) * (s.length - 1));
        this.setState({ hoverIdx: Math.max(0, Math.min(s.length - 1, i)) });
      },
      histLeave: () => this.setState({ hoverIdx: null }),
      histHover: this.state.hoverIdx !== null,
      histHoverX: (this.state.hoverIdx !== null ? (this.state.hoverIdx / (s.length - 1)) * 100 : 0).toFixed(2) + '%',
      histHoverY: (this.state.hoverIdx !== null ? (parseFloat(y(s[this.state.hoverIdx])) / 200) * 100 : 0).toFixed(2) + '%',
      histHoverPrice: '$' + (s[this.state.hoverIdx ?? 0]).toFixed(2),
      histHoverDay: this.state.hoverIdx !== null ? this.dayLabel(Math.round((s.length - 1 - this.state.hoverIdx) * (30 / (s.length - 1)))) : '',
      histToggle: () => this.toggle(d.id),
      histBtnLabel: on ? '✓ ALERT ARMED' : '+ ADD ALERT',
      histBtnBg: on ? 'transparent' : LIME,
      histBtnFg: on ? LIME : INK,
      stop: (ev) => ev.stopPropagation(),
      closeHistory: () => this.setState({ history: null, hoverIdx: null }),
    };
  }

  renderVals() {
    const f = this.state.filter, armed = this.state.armed;
    const target = this.target || (Date.now() + 4 * 3600e3);
    const left = Math.max(0, Math.floor((target - this.state.now) / 1000));
    const pad = n => String(n).padStart(2, '0');
    const clock = [
      { k: 'DAYS', u: 'D', v: pad(Math.floor(left / 86400)) },
      { k: 'HRS', u: 'H', v: pad(Math.floor(left / 3600) % 24) },
      { k: 'MIN', u: 'M', v: pad(Math.floor(left / 60) % 60) },
      { k: 'SEC', u: 'S', v: pad(left % 60) },
    ];
    const heroOn = !!armed.hero;
    const q = this.state.q.trim().toLowerCase();
    const catOf = d => /booster|display/i.test(d.name) ? 'BOOSTERS'
      : /secret lair/i.test(d.name) ? 'SECRET LAIR'
      : /precon|commander/i.test(d.name) ? 'PRECONS'
      : /bundle|gift/i.test(d.name) ? 'BUNDLES' : 'OTHER';
    const num = p => (p == null ? NaN : parseFloat(String(p).replace(/[^0-9.]/g, '')));
    let shown = ALL_DEALS
      .filter(d => f === 'ALL' || (f === 'UNDER' ? d.under : d.src === f))
      .filter(d => this.state.cat === 'ALL' || catOf(d) === this.state.cat)
      .filter(d => !q || d.name.toLowerCase().includes(q) || d.retailer.toLowerCase().includes(q));
    const srt = this.state.sort;
    shown = shown.slice().sort((a, b) =>
      srt === 'LOW' ? num(a.price) - num(b.price)
      : srt === 'HIGH' ? num(b.price) - num(a.price)
      : (num(b.msrp) - num(b.price)) / num(b.msrp) - (num(a.msrp) - num(a.price)) / num(a.msrp));
    const dp = this.pager(shown.length, 6, this.state.dealPage, 'dealPage');
    const up = this.pager(EVENTS.length, 6, this.state.upPage, 'upPage');
    const CATS = [
      { name: 'Secret Lair', key: 'SECRET LAIR', slot: 'cat-sl', art: './img/category-secretlair.jpg' },
      { name: 'Boosters', key: 'BOOSTERS', slot: 'cat-boosters', art: './img/category-boosters.jpg' },
      { name: 'Commander Precons', key: 'PRECONS', slot: 'cat-precons', art: './img/category-precons.jpg' },
      { name: 'Bundles', key: 'BUNDLES', slot: 'cat-bundles', art: './img/category-bundles.jpg' },
      { name: 'Everything', key: 'ALL', slot: 'cat-all', art: './img/category-all.jpg' },
    ];

    return {
      dealPages: dp.multi, dealDots: dp.dots, dealPrev: dp.prev, dealNext: dp.next,
      upPages: up.multi, upDots: up.dots, upPrev: up.prev, upNext: up.next,
      menuOpen: this.state.menuOpen,
      menuBd: this.state.menuOpen ? LIME : 'rgba(233,230,223,.2)',
      menuFg: this.state.menuOpen ? LIME : '#e9e6df',
      toggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      armAllFromMenu: () => {
        const all = {};
        ALL_DEALS.forEach(d => { all[d.id] = true; });
        EVENTS.forEach(e => { all[e.id] = true; });
        LOCAL.forEach(e => { all[e.id] = true; });
        CONS.forEach(c => { all[c.id] = true; });
        ['hot-1', 'hot-2', 'hot-3'].forEach(k => { all[k] = true; });
        all.hero = true;
        if (window.tcgEnsurePushEnabled) window.tcgEnsurePushEnabled();
        this.setState({ armed: all, menuOpen: false });
      },
      menuItems: [
        { label: 'DROPS', href: '#tracking', fg: LIME },
        { label: "WHAT'S HOT", href: '#hot', fg: '#e9e6df' },
        { label: 'RELEASE CALENDAR', href: '#calendar', fg: '#e9e6df' },
        { label: 'MY WATCHLIST', href: '#watchlist', fg: '#e9e6df' },
        { label: 'EVENTS NEAR ME', href: '#events', fg: '#e9e6df' },
      ],
      searchOpen: this.state.searchOpen,
      openSearch: () => this.setState({ searchOpen: true }),
      closeSearch: () => this.setState({ searchOpen: false, q: '' }),
      noResults: !!q && ALL_DEALS.filter(d => d.name.toLowerCase().includes(q)).length === 0,
      results: (q ? ALL_DEALS.filter(d => d.name.toLowerCase().includes(q) || d.retailer.toLowerCase().includes(q)) : ALL_DEALS.slice(0, 4)).map(d => {
        return {
          name: d.name,
          msrp: d.msrp,
          quotes: [
            { src: d.retailer, price: d.price, bg: d.under ? 'rgba(176,255,54,.1)' : 'transparent', bd: d.under ? LIME : BD, fg: d.under ? LIME : '#fff', labelFg: DIM },
          ],
        };
      }),
      q: this.state.q,
      setQ: (e) => this.setState({ q: e.target.value }),
      resultCount: String(shown.length).padStart(2, '0'),
      underCount: String(shown.filter(d => d.under).length).padStart(2, '0'),
      cats: CATS.map(c => {
        const on = this.state.cat === c.key;
        return {
          ...c,
          count: String(c.key === 'ALL' ? ALL_DEALS.length : ALL_DEALS.filter(d => catOf(d) === c.key).length).padStart(2, '0'),
          pick: () => this.setState({ cat: c.key }),
          bg: on ? 'rgba(176,255,54,.08)' : '#100b1b',
          bd: on ? LIME : 'rgba(233,230,223,.1)',
          countFg: on ? LIME : 'rgba(233,230,223,.55)',
        };
      }),
      sortOpts: [
        { k: 'DEAL', label: 'BEST DEAL' },
        { k: 'LOW', label: 'PRICE ↑' },
        { k: 'HIGH', label: 'PRICE ↓' },
      ],
      sort: srt,
      setSort: (e) => this.setState({ sort: e.target.value, dealPage: 0 }),
      tickerDur: (this.props.tickerSpeed ?? 34) + 's',
      tickerLoop: [{}, {}],
      // Built from the SAME live-patched ALL_DEALS objects the cards below
      // use (via dealTicker()), not separately hardcoded strings — so the
      // ticker can never say something the cards themselves disagree with.
      tickerItems: [
        { glyph: '●', tone: PURPLE, label: `REALITY FRACTURE PRERELEASE IN ${clock[1].v}H ${clock[2].v}M`, url: 'https://magic.wizards.com/en/products/reality-fracture' },
        dealTicker('hobbit-walmart', '▼', LIME),
        dealTicker('doom-prevails', '▲', RED),
        dealTicker('reality-fracture-sld-walmart', '▲', RED),
        dealTicker('motu-secretlair', '◆', LIME),
      ],
      clock,
      heroShort: `${clock[1].v}H ${clock[2].v}M`,
      heroStats: [
        { k: 'SET', v: 'FRA', c: '#fff' },
        { k: 'PRERELEASE', v: 'SEP 25', c: LIME },
        { k: 'RELEASE', v: 'OCT 02', c: '#fff' },
      ],
      heroSource: 'WIZARDS OFFICIAL',
      hot: HOT_ITEMS.map(h => {
        const on = !!armed[h.slot];
        return { ...h, toggle: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); this.toggle(h.slot); }, ...this.btn(on, '✓ ALERT ARMED', '+ ADD ALERT') };
      }),
      // Alternating category-secretlair.jpg / secretlair-alt.jpg (the two
      // Secret Lair logo images) so five back-to-back cards don't show
      // the exact same image five times in a row.
      lairs: [
        { slot: 'lair-1', art: './img/category-secretlair.jpg', name: 'By the Power of Grayskull!', price: '$29.99' },
        { slot: 'lair-2', art: './img/secretlair-alt.jpg', name: 'Nyah-ha-ha!', price: '$29.99' },
        { slot: 'lair-3', art: './img/category-secretlair.jpg', name: 'She-Ra, Princess of Power', price: '$29.99' },
        { slot: 'lair-4', art: './img/secretlair-alt.jpg', name: 'Allies and Enemies of Eternia', price: '$29.99' },
        { slot: 'lair-5', art: './img/category-secretlair.jpg', name: 'Sold Separately', price: '$29.99' },
      ],
      howShots: [
        { slot: 'how-1', label: 'SECRET LAIR' },
        { slot: 'how-2', label: 'BOOSTER BOXES' },
        { slot: 'how-3', label: 'COMMANDER PRECONS' },
        { slot: 'how-4', label: 'BUNDLES' },
      ],
      steps: [
        { n: '1', t: 'Wizards posts the drop' },
        { n: '2', t: 'You set your price cap' },
        { n: '3', t: 'We poll 4 official sources' },
        { n: '4', t: 'Alert fires — push, SMS, email' },
        { n: '5', t: 'You check out at MSRP' },
      ].map((x, i) => ({ ...x, bg: i === 0 ? LIME : 'rgba(168,85,247,.2)', fg: i === 0 ? INK : '#e9d9ff' })),
      armedCount: pad(Object.values(armed).filter(Boolean).length),
      armAll: () => {
        const all = {};
        ALL_DEALS.forEach(d => { all[d.id] = true; });
        EVENTS.forEach(e => { all[e.id] = true; });
        LOCAL.forEach(e => { all[e.id] = true; });
        CONS.forEach(c => { all[c.id] = true; });
        ['hot-1', 'hot-2', 'hot-3'].forEach(k => { all[k] = true; });
        all.hero = true;
        this.setState({ armed: all });
      },
      armHero: () => this.toggle('hero'),
      heroLabel: heroOn ? '✓ ALERT ARMED' : 'ADD ALERT',
      heroBg: heroOn ? 'transparent' : LIME,
      heroFg: heroOn ? LIME : INK,
      heroBd: LIME,
      heroGlow: heroOn ? 'none' : '0 0 26px rgba(176,255,54,.34)',
      filters: FILTERS.map(x => ({
        label: x.label,
        pick: () => this.setState({ filter: x.key }),
        bg: f === x.key ? PURPLE : 'transparent',
        fg: f === x.key ? '#fff' : DIM,
        bd: f === x.key ? PURPLE : BD,
      })),
      deals: shown.slice(dp.start, dp.start + 6).map(d => {
        const on = !!armed[d.id];
        return {
          ...d,
          slot: 'sw-' + d.id,
          spark: spark(d.series),
          priceColor: d.under ? LIME : PURPLE,
          edge: d.under ? LIME : PURPLE,
          chipBg: d.src === 'SL' ? PURPLE : 'rgba(8,6,14,.82)',
          chipFg: d.src === 'SL' ? '#fff' : 'rgba(233,230,223,.8)',
          toggle: () => this.toggle(d.id),
          openHistory: () => this.setState({ history: d.id, hoverIdx: null }),
          target: this.targetOf(d),
          setTarget: (ev) => {
            const v = ev.target.value.replace(/[^0-9.]/g, '');
            this.setState(st => ({ targets: { ...st.targets, [d.id]: v } }));
          },
          ...this.btn(on, '✓ ALERT ARMED', '+ ADD ALERT'),
        };
      }),
      upcoming: EVENTS.slice(up.start, up.start + 6).map(e => {
        const on = !!armed[e.id];
        const tone = e.hot === 2 ? RED : e.hot === 1 ? LIME : DIM;
        return {
          ...e,
          slot: e.id,
          fg: tone,
          bg: e.hot === 2 ? 'rgba(255,92,122,.16)' : 'rgba(8,6,14,.8)',
          bd: e.hot ? tone : BD,
          toggle: () => this.toggle(e.id),
          ...this.btn(on, '✓ ALERT ARMED', '+ ADD ALERT'),
        };
      }),
      zip: this.state.zip,
      setZip: (e) => this.setState({ zip: e.target.value.replace(/[^0-9]/g, '').slice(0, 5) }),
      radii: [25, 50, 100, 250].map(r => ({
        label: r + ' MI',
        pick: () => this.setState({ radius: r }),
        bg: this.state.radius === r ? LIME : 'transparent',
        fg: this.state.radius === r ? INK : DIM,
        bd: this.state.radius === r ? LIME : BD,
      })),
      nearSummary: (() => {
        const n = LOCAL.filter(e => e.dist <= this.state.radius).length;
        const z = this.state.zip.length === 5 ? this.state.zip : '—';
        return n + ' EVENT' + (n === 1 ? '' : 'S') + ' WITHIN ' + this.state.radius + ' MI OF ' + z + ' · UPDATED HOURLY FROM OFFICIAL STORE LOCATOR';
      })(),
      nearby: LOCAL.filter(e => e.dist <= this.state.radius).map(e => {
        const on = !!armed[e.id];
        const tone = e.hot === 2 ? RED : e.hot === 1 ? LIME : PURPLE;
        return {
          ...e,
          dist: e.dist.toFixed(1),
          tone,
          kindBg: e.hot === 2 ? RED : e.hot === 1 ? LIME : 'rgba(168,85,247,.22)',
          kindFg: e.hot === 2 ? '#170409' : e.hot === 1 ? INK : '#e9d9ff',
          toggle: () => this.toggle(e.id),
          ...this.btn(on, '\u2713 ALERT ARMED', '+ ADD ALERT'),
        };
      }),
      cons: CONS.map(c => {
        const on = !!armed[c.id];
        return { ...c, toggle: () => this.toggle(c.id), ...this.btn(on, '\u2713 ALERT ARMED', '+ ADD ALERT') };
      }),
      watch: WATCH_ITEMS.map(w => {
        // Null-safe: `now`/`pct` start null until pwa-boot.js's live patch
        // fills them in from a real scrape. Rather than fabricate a value,
        // an unchecked item just shows a neutral "not yet checked" state.
        if (w.now == null || w.pct == null) {
          return { ...w, now: '—', color: DIM, ink: '#fff', badge: 'NOT YET CHECKED', delta: w.ago, cta: 'VIEW LISTING →' };
        }
        const hot = w.pct >= 12, at = w.pct === 0, over = w.pct < 0;
        return {
          ...w,
          color: over ? RED : at ? PURPLE : LIME,
          ink: over ? '#170409' : at ? '#fff' : INK,
          badge: over ? 'ABOVE MSRP' : at ? 'AT MSRP' : hot ? 'BEST PRICE YET' : 'BELOW MSRP',
          delta: at ? 'MSRP — NO DISCOUNT' : over ? Math.abs(w.pct) + '% OVER MSRP · +$' + (parseFloat(w.now.slice(1)) - parseFloat(w.was.slice(1))).toFixed(2) : w.pct + '% OFF MSRP · SAVE $' + (parseFloat(w.was.slice(1)) - parseFloat(w.now.slice(1))).toFixed(2),
          cta: over ? 'AVOID — SEE LISTING →' : at ? 'VIEW DROP →' : 'BUY NOW →',
        };
      }),
      ...this.historyVals(),
      next: [
        { i: '01', t: 'Add-to-watchlist flow with price-cap slider' },
        { i: '02', t: 'Lock-screen push + Watch complication' },
        { i: '03', t: 'Source trust rules — what counts as official' },
        { i: '04', t: 'Drop receipts — did I actually get it?' },
      ],
    };
  }
}

window.DCRuntime.mount({ templateId: 'dc-template', rootId: 'dc-root', ComponentClass: Component, props: { tickerSpeed: 90 } });
</script>
<script src="/urgent-ticker.js"></script>
<script src="/push-client.js"></script>
</body>
</html>
