<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCGTracker — Lorcana</title>
<meta name="theme-color" content="#060b1a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060b1a;color:#e8ecf7;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty;overflow-x:hidden;--tcg-push-accent:#8f9df0;--tcg-push-accent-ink:#141a44}
a{color:#8f9df0;text-decoration:none}a:hover{color:#a9b6f2}
::-webkit-scrollbar{width:0;height:0}
@keyframes sw-blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sw-ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.sw-ticker-wrap:hover .sw-ticker-track{animation-play-state:paused}
.tt-slider{display:flex!important;grid-template-columns:none!important;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tt-slider::-webkit-scrollbar{height:6px}
.tt-slider::-webkit-scrollbar-thumb{background:rgba(232,236,247,.2);border-radius:999px}
.tt-slider>*{flex:0 0 262px;width:262px;scroll-snap-align:start}
.tt-slider.tt-sm>*{flex-basis:190px;width:190px}
.tt-slider.tt-lg>*{flex-basis:285px;width:285px}
.tcg-nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;z-index:1}
.tcg-nav-item{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid rgba(232,236,247,.18);text-decoration:none;flex:none;color:#e8ecf7}
.tcg-nav-item.active{border-color:#8f9df0;background:rgba(143,157,240,.18)}
.tcg-nav-icon{width:19px;height:19px;border-radius:6px;object-fit:cover;display:block}
.tcg-nav-item svg{display:block}
.tcg-nav-tip{position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(2px);background:#141a33;color:#fff;font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.04em;padding:5px 10px;border-radius:8px;white-space:nowrap;border:1px solid rgba(232,236,247,.18);opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:6}
.tcg-nav-item:hover .tcg-nav-tip,.tcg-nav-item:focus-visible .tcg-nav-tip{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:680px){.tcg-brand-word{display:none}}
@media (max-width:480px){.tcg-header-inner{padding-left:14px!important;padding-right:14px!important}}
.sw-hero-grid{position:relative;display:flex;flex-direction:column;gap:28px;padding:36px 20px 40px;box-sizing:border-box}
.sw-hero-grid>*:first-child{width:100%}
.sw-hero-grid>*:last-child{width:100%;max-width:420px}
@media (min-width:860px){
.sw-hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:40px;align-items:center;padding:0 40px;min-height:100vh}
.sw-hero-grid>*:last-child{max-width:none}
}
</style>
<style id="dc-hover-styles"></style>
</head>
<body data-game="lorcana">
<div id="dc-root"></div>
<template id="dc-template">



<sc-if value="{{ hist }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeHistory }}" style="position:fixed;inset:0;z-index:60;background:rgba(3,6,16,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:26px">
<div onClick="{{ stop }}" style="width:min(760px,100%);background:#0e1732;border:1px solid rgba(232,236,247,.14);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6)">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px 0">
<div>
<div style="display:flex;align-items:center;gap:8px">
<div onClick="{{ openSearch }}" title="Search" style="cursor:pointer;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(232,236,247,.2);display:flex;align-items:center;justify-content:center" style-hover="border-color:#8f9df0">
<svg width="16" height="17" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.8" style="color:#e8ecf7"></circle><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:#e8ecf7"></line></svg>
</div>
<div style="position:relative">
<div onClick="{{ toggleMenu }}" title="Menu" style="cursor:pointer;width:36px;height:36px;border-radius:50%;border:1px solid {{ menuBd }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
<span style="width:15px;height:1.6px;background:{{ menuFg }};display:block"></span>
<span style="width:15px;height:1.6px;background:{{ menuFg }};display:block"></span>
<span style="width:15px;height:1.6px;background:{{ menuFg }};display:block"></span>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:46px;right:0;z-index:75;min-width:212px;background:#0e1732;border:1px solid rgba(232,236,247,.18);border-radius:16px;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)">
<sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="5">
<a href="{{ m.href }}" onClick="{{ closeMenu }}" style="display:block;text-decoration:none;font-family:'Roboto Mono',monospace;font-size:14px;color:{{ m.fg }};padding:11px 14px;border-radius:10px;white-space:nowrap" style-hover="background:rgba(255,255,255,.06)">{{ m.label }}</a>
</sc-for>
<div onClick="{{ armAllFromMenu }}" style="cursor:pointer;text-align:center;margin-top:8px;background:#3d4fbe;color:#ffffff;font-family:Archivo,sans-serif;font-weight:700;font-size:14px;padding:11px 16px;border-radius:999px;white-space:nowrap">ARM ALL</div>
</div>
</sc-if>
</div>
<span style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.62)">{{ histRetailer }} · LAST 30 DAYS</span>
</div>
<div style="font-size:26px;font-family:Archivo,sans-serif;font-weight:700;letter-spacing:-.02em;color:#fff;margin-top:9px;line-height:1.1">{{ histName }}</div>
</div>
<div onClick="{{ closeHistory }}" style="cursor:pointer;flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(232,236,247,.2);display:flex;align-items:center;justify-content:center;font-size:15px;color:#e8ecf7" style-hover="border-color:#8f9df0;color:#8f9df0">✕</div>
</div>

<div style="display:flex;gap:26px;flex-wrap:wrap;padding:18px 22px 0">
<sc-for list="{{ histStats }}" as="st" hint-placeholder-count="4">
<div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.55)">{{ st.k }}</div>
<div style="font-family:Archivo,sans-serif;font-weight:700;font-size:22px;color:{{ st.c }};line-height:1.2">{{ st.v }}</div>
</div>
</sc-for>
</div>

<div style="padding:16px 22px 0">
<div onMouseMove="{{ histMove }}" onMouseLeave="{{ histLeave }}" style="position:relative;cursor:crosshair">
<svg viewBox="0 0 640 200" width="100%" height="200" preserveAspectRatio="none" style="display:block;pointer-events:none">
<polyline points="{{ histArea }}" fill="{{ histFill }}" stroke="none"></polyline>
<polyline points="{{ histLine }}" fill="none" stroke="{{ histColor }}" stroke-width="2"></polyline>
<line x1="0" y1="{{ histMsrpY }}" x2="640" y2="{{ histMsrpY }}" stroke="#e3c07f" stroke-width="1" stroke-dasharray="5 5"></line>
</svg>
<sc-if value="{{ histHover }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:0;bottom:0;width:1px;background:rgba(232,236,247,.45);pointer-events:none;left:{{ histHoverX }}"></div>
<div style="position:absolute;width:11px;height:11px;border-radius:50%;background:{{ histColor }};border:2px solid #0e1732;pointer-events:none;transform:translate(-50%,-50%);left:{{ histHoverX }};top:{{ histHoverY }}"></div>
<div style="position:absolute;pointer-events:none;transform:translate(-50%,-140%);left:{{ histHoverX }};top:{{ histHoverY }};background:#0a1024;border:1px solid rgba(232,236,247,.24);border-radius:10px;padding:7px 11px;white-space:nowrap;text-align:center">
<div style="font-family:Archivo,sans-serif;font-weight:700;font-size:16px;color:{{ histColor }};line-height:1">{{ histHoverPrice }}</div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.62);margin-top:4px">{{ histHoverDay }}</div>
</div>
</sc-if>
</div>
<div style="display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.55);margin-top:6px">
<span>{{ histStartDate }}</span><span style="color:#e3c07f">— — MSRP {{ histMsrp }}</span><span>{{ histEndDate }}</span>
</div>
</div>

<div style="padding:18px 22px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<div onClick="{{ histToggle }}" style="cursor:pointer;background:{{ histBtnBg }};color:{{ histBtnFg }};border:1px solid #5c72d8;font-family:Archivo,sans-serif;font-weight:700;font-size:14px;padding:11px 24px;border-radius:999px">{{ histBtnLabel }}</div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.62)">{{ histNote }}</div>
</div>
</div>
</div>
</sc-if>

<div style="position:relative;background:
radial-gradient(62% 40% at 88% -6%,rgba(227,192,127,.30) 0%,transparent 62%),
radial-gradient(50% 34% at 2% 4%,rgba(92,114,216,.13) 0%,transparent 60%),
#060b1a">
<sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;inset:0;z-index:80;background:rgba(3,6,16,.94);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:34px 40px">
<div style="display:flex;align-items:center;gap:18px;max-width:900px;width:100%;margin:0 auto;padding-bottom:22px;border-bottom:1px solid rgba(232,236,247,.2)">
<svg width="22" height="22" viewBox="0 0 20 20" fill="none" style="flex:none"><circle cx="8.5" cy="8.5" r="6" stroke="#5c72d8" stroke-width="1.8"></circle><line x1="13" y1="13" x2="18" y2="18" stroke="#5c72d8" stroke-width="1.8" stroke-linecap="round"></line></svg>
<input value="{{ q }}" onChange="{{ setQ }}" autoFocus="{{ true }}" placeholder="Search sets, decks, Illumineer’s Quest…" style="flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-family:Archivo,sans-serif;font-weight:700;letter-spacing:-.005em;font-size:34px">
<div onClick="{{ closeSearch }}" style="cursor:pointer;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,236,247,.2);display:flex;align-items:center;justify-content:center;color:#e8ecf7;font-size:16px" style-hover="border-color:#8f9df0;color:#8f9df0">✕</div>
</div>

<div style="max-width:900px;width:100%;margin:0 auto;overflow:auto;padding-top:26px">
<sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
<div style="padding:22px 0;border-bottom:1px solid rgba(232,236,247,.1)">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap">
<div style="font-size:20px;font-weight:700;letter-spacing:-.005em;color:#fff">{{ r.name }}</div>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.55)">MSRP {{ r.msrp }}</div>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
<sc-for list="{{ r.quotes }}" as="qt" hint-placeholder-count="3">
<div style="display:flex;align-items:baseline;gap:10px;background:{{ qt.bg }};border:1px solid {{ qt.bd }};border-radius:999px;padding:9px 16px">
<span style="font-family:'Roboto Mono',monospace;font-size:14px;color:{{ qt.labelFg }};white-space:nowrap">{{ qt.src }}</span>
<span style="font-family:Archivo,sans-serif;font-weight:700;font-size:19px;color:{{ qt.fg }}">{{ qt.price }}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
<sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
<div style="font-size:16px;color:rgba(232,236,247,.6);padding:26px 0">No tracked products match that. Try a set name or product type.</div>
</sc-if>
<div style="font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.45);line-height:1.7;padding:26px 0 8px">PRICES SHOWN ARE FROM THE LISTED RETAILER DIRECTLY · NO TCGPLAYER OR THIRD-PARTY MARKET DATA TRACKED YET</div>
</div>
</div>
</sc-if>

<div style="position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27220%27%20height=%27220%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.85%27%20numOctaves=%274%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27220%27%20height=%27220%27%20filter=%27url%28%23n%29%27%20opacity=%270.5%27/%3E%3C/svg%3E);background-size:220px 220px"></div>

<div class="sw-ticker-wrap" style="background:#0e1732;overflow:hidden;padding:8px 0;border-bottom:1px solid rgba(227,192,127,.28)">
<div class="sw-ticker-track" style="display:flex;width:max-content;animation:sw-ticker 34s linear infinite;animation-duration:{{ tickerDur }}">
<sc-for list="{{ tickerLoop }}" as="lap" hint-placeholder-count="2">
<div style="display:flex;gap:34px;flex:0 0 auto;width:max-content;padding-right:34px">
<sc-for list="{{ tickerItems }}" as="t" hint-placeholder-count="3">
<a href="{{ t.url }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:'Roboto Mono',monospace;font-size:14px;color:rgba(232,236,247,.62);white-space:nowrap" style-hover="color:#8f9df0">
<span style="color:{{ t.tone }}">{{ t.glyph }}</span>{{ t.label }}
</a>
</sc-for>
</div>
</sc-for>
</div>
</div>

<div style="max-width:1340px;margin:0 auto;padding:0 40px 150px">

<div data-tcg-sticky-header style="position:sticky;top:0;z-index:85;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);background:#060b1a;border-bottom:1px solid rgba(232,236,247,.1)">
<div class="tcg-header-inner" style="position:relative;max-width:1340px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">

  { id: 'con-challenge-tampa', slot: 'con-2', tag: 'OFFICIAL CHALLENGE', name: 'Disney Lorcana Challenge \u2014 Tampa', place: 'Tampa, FL', when: 'DEC 18\u201320, 2026 \u00b7 NORTH AMERICAN CHALLENGE', status: 'WORLD CHAMPIONSHIP INVITE ON TOP FINISH', dist: '~574 MI AWAY (EST.)', tone: '#8f9df0', slotHint: 'Convention floor photo' },
  { id: 'con-worlds-hawaii', slot: 'con-3', tag: 'FLAGSHIP EVENT', name: 'Disney Lorcana World Championship 2026', place: 'Aulani Resort \u2014 Hawaii', when: 'DEC 04\u201306, 2026 \u00b7 38 INVITED COMPETITORS WORLDWIDE', status: 'INVITE-ONLY', dist: 'NOT REACHABLE BY ROAD \u2014 FLIGHT REQUIRED', tone: '#8f9df0', slotHint: 'Showcase stage photo' },
];

class Component extends DCLogic {
  state = { now: Date.now(), filter: 'ALL', menuOpen: false, searchOpen: false, q: '', cat: 'ALL', sort: 'DEAL', dealPage: 0, upPage: 0, history: null, hoverIdx: null, targets: {}, zip: '78701', radius: 50, armed: { 'sl-super': true, 'ev-superdrop': true, hero: true } };

  componentDidMount() {
    this.target = Date.now() + (4 * 3600 + 12 * 60 + 7) * 1000;
    this.t = setInterval(() => this.setState({ now: Date.now() }), 1000);

    // Live data — patches ALL_DEALS in place from the backend, matched by
    // URL. See public/pwa-boot.js for what this actually does.
    const refresh = () => window.TCGLiveData && window.TCGLiveData.refreshAll({ deals: ALL_DEALS, hot: HOT_ITEMS, watch: WATCH_ITEMS }, () => this.setState({}));
    refresh();
    this.liveInterval = setInterval(refresh, 20000);
  }
  componentWillUnmount() { clearInterval(this.t); clearInterval(this.liveInterval); }

  toggle(id) {
    this.setState(s => {
      const nowArmed = !s.armed[id];
      if (nowArmed && window.tcgEnsurePushEnabled) window.tcgEnsurePushEnabled();
      return { armed: { ...s.armed, [id]: nowArmed } };
    });
  }

  btn(on, onLabel, offLabel) {
    return {
      btnLabel: on ? onLabel : offLabel,
      btnBg: on ? 'transparent' : FILL,
      btnFg: on ? LIME : INK,
      btnBd: LINE,
      btnGlow: on ? 'none' : '0 0 20px rgba(92,114,216,.22)',
    };
  }

  pager(total, per, page, key) {
    const pages = Math.ceil(total / per) || 1;
    const cur = Math.min(page, pages - 1);
    return {
      multi: pages > 1,
      start: cur * per,
      prev: () => this.setState({ [key]: (cur - 1 + pages) % pages }),
      next: () => this.setState({ [key]: (cur + 1) % pages }),
      dots: Array.from({ length: pages }, (_, i) => ({
        n: String(i + 1),
        pick: () => this.setState({ [key]: i }),
        bg: i === cur ? FILL : 'transparent',
        fg: i === cur ? INK : DIM,
        bd: i === cur ? LINE : BD,
      })),
    };
  }

  dayLabel(daysAgo) {
    const d = new Date(Date.now() - daysAgo * 86400e3);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
  }

  targetOf(d) {
    const t = this.state.targets[d.id];
    return t === undefined ? parseFloat(d.msrp.replace(/[^0-9.]/g, '')).toFixed(2) : t;
  }

  historyVals() {
    const d = ALL_DEALS.find(x => x.id === this.state.history);
    if (!d) return { hist: false };
    const s = d.series, min = Math.min(...s), max = Math.max(...s), r = (max - min) || 1;
    const pad = (max - min) * 0.25 || max * 0.06;
    const lo = min - pad, hi = max + pad, span = hi - lo;
    const y = v => (190 - (v - lo) / span * 180).toFixed(1);
    const pts = s.map((v, i) => `${(i / (s.length - 1) * 640).toFixed(1)},${y(v)}`);
    const msrpNum = parseFloat(d.msrp.replace(/[^0-9.]/g, ''));
    const on = !!this.state.armed[d.id];
    return {
      hist: true,
      histName: d.name,
      histRetailer: d.retailer,
      histMark: d.mark, histMarkBg: d.markBg, histMarkFg: d.markFg,
      histColor: d.under ? LIME : PURPLE,
      histFill: d.under ? 'rgba(92,114,216,.12)' : 'rgba(227,192,127,.14)',
      histLine: pts.join(' '),
      histArea: ['0,200', ...pts, '640,200'].join(' '),
      histMsrp: d.msrp,
      histStartDate: this.dayLabel(30),
      histEndDate: this.dayLabel(0),
      histMsrpY: y(msrpNum),
      histStats: [
        { k: 'NOW', v: d.price, c: d.under ? LIME : PURPLE },
        { k: 'MSRP', v: d.msrp, c: '#fff' },
        { k: '30D LOW', v: '$' + Math.min(...s).toFixed(2), c: LIME },
        { k: '30D HIGH', v: '$' + Math.max(...s).toFixed(2), c: RED },
        { k: 'VS MSRP', v: d.delta, c: d.under ? LIME : PURPLE },
      ],
      histNote: on ? 'ALERTS ON AT OR BELOW $' + this.targetOf(d) + ' — PUSH · SMS · EMAIL' : 'WE WATCH ALL 4 OFFICIAL SOURCES',
      histMove: (ev) => {
        const r = ev.currentTarget.getBoundingClientRect();
        const i = Math.round(((ev.clientX - r.left) / r.width) * (s.length - 1));
        this.setState({ hoverIdx: Math.max(0, Math.min(s.length - 1, i)) });
      },
      histLeave: () => this.setState({ hoverIdx: null }),
      histHover: this.state.hoverIdx !== null,
      histHoverX: (this.state.hoverIdx !== null ? (this.state.hoverIdx / (s.length - 1)) * 100 : 0).toFixed(2) + '%',
      histHoverY: (this.state.hoverIdx !== null ? (parseFloat(y(s[this.state.hoverIdx])) / 200) * 100 : 0).toFixed(2) + '%',
      histHoverPrice: '$' + (s[this.state.hoverIdx ?? 0]).toFixed(2),
      histHoverDay: this.state.hoverIdx !== null ? this.dayLabel(Math.round((s.length - 1 - this.state.hoverIdx) * (30 / (s.length - 1)))) : '',
      histToggle: () => this.toggle(d.id),
      histBtnLabel: on ? '✓ ALERT ARMED' : '+ ADD ALERT',
      histBtnBg: on ? 'transparent' : FILL,
      histBtnFg: on ? LIME : INK,
      stop: (ev) => ev.stopPropagation(),
      closeHistory: () => this.setState({ history: null, hoverIdx: null }),
    };
  }

  renderVals() {
    const f = this.state.filter, armed = this.state.armed;
    const target = this.target || (Date.now() + 4 * 3600e3);
    const left = Math.max(0, Math.floor((target - this.state.now) / 1000));
    const pad = n => String(n).padStart(2, '0');
    const clock = [
      { k: 'DAYS', u: 'D', v: pad(Math.floor(left / 86400)) },
      { k: 'HRS', u: 'H', v: pad(Math.floor(left / 3600) % 24) },
      { k: 'MIN', u: 'M', v: pad(Math.floor(left / 60) % 60) },
      { k: 'SEC', u: 'S', v: pad(left % 60) },
    ];
    const heroOn = !!armed.hero;
    const q = this.state.q.trim().toLowerCase();
    const catOf = d => /booster|display/i.test(d.name) ? 'BOOSTERS'
      : /quest/i.test(d.name) ? 'QUEST'
      : /starter/i.test(d.name) ? 'PRECONS'
      : /bundle|gift/i.test(d.name) ? 'BUNDLES' : 'OTHER';
    const num = p => (p == null ? NaN : parseFloat(String(p).replace(/[^0-9.]/g, '')));
    let shown = ALL_DEALS
      .filter(d => f === 'ALL' || (f === 'UNDER' ? d.under : d.src === f))
      .filter(d => this.state.cat === 'ALL' || catOf(d) === this.state.cat)
      .filter(d => !q || d.name.toLowerCase().includes(q) || d.retailer.toLowerCase().includes(q));
    const srt = this.state.sort;
    shown = shown.slice().sort((a, b) =>
      srt === 'LOW' ? num(a.price) - num(b.price)
      : srt === 'HIGH' ? num(b.price) - num(a.price)
      : (num(b.msrp) - num(b.price)) / num(b.msrp) - (num(a.msrp) - num(a.price)) / num(a.msrp));
    const dp = this.pager(shown.length, 6, this.state.dealPage, 'dealPage');
    const up = this.pager(EVENTS.length, 6, this.state.upPage, 'upPage');
    const CATS = [
      { name: 'Booster Boxes', key: 'BOOSTERS', slot: 'cat-boosters', art: 'https://ravensburger.cloud/cms/gallery/lorcana-web/products/s6/products/lorcana_set_6_booster_850x850_en.png' },
      { name: 'Starter Decks', key: 'PRECONS', slot: 'cat-starters', art: 'https://ravensburger.cloud/cms/gallery/lorcana-web/products/jafar/skus/en/en_jytakhhxo3.png' },
      { name: "Illumineer's Quest", key: 'QUEST', slot: 'cat-quest', art: 'https://ravensburger.cloud/cms/gallery/lorcana-web/products/dt/en_9qtnfq4muo.png' },
      { name: 'Gift Sets', key: 'BUNDLES', slot: 'cat-gift', art: 'https://target.scene7.com/is/image/Target/GUEST_2e0ed7c9-b720-433d-a239-b981cd18af9b' },
      { name: 'Everything', key: 'ALL', slot: 'cat-all', art: 'https://target.scene7.com/is/image/Target/GUEST_fde042cc-275e-4e77-b901-c4908de1470c' },
    ];

    return {
      dealPages: dp.multi, dealDots: dp.dots, dealPrev: dp.prev, dealNext: dp.next,
      upPages: up.multi, upDots: up.dots, upPrev: up.prev, upNext: up.next,
      menuOpen: this.state.menuOpen,
      menuBd: this.state.menuOpen ? LIME : 'rgba(232,236,247,.2)',
      menuFg: this.state.menuOpen ? LIME : '#e8ecf7',
      toggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      armAllFromMenu: () => {
        const all = {};
        ALL_DEALS.forEach(d => { all[d.id] = true; });
        EVENTS.forEach(e => { all[e.id] = true; });
        LOCAL.forEach(e => { all[e.id] = true; });
        CONS.forEach(c => { all[c.id] = true; });
        ['hot-1', 'hot-2', 'hot-3'].forEach(k => { all[k] = true; });
        all.hero = true;
        if (window.tcgEnsurePushEnabled) window.tcgEnsurePushEnabled();
        this.setState({ armed: all, menuOpen: false });
      },
      menuItems: [
        { label: 'DROPS', href: '#tracking', fg: LIME },
        { label: "WHAT'S HOT", href: '#hot', fg: '#e8ecf7' },
        { label: 'RELEASE CALENDAR', href: '#calendar', fg: '#e8ecf7' },
        { label: 'MY WATCHLIST', href: '#watchlist', fg: '#e8ecf7' },
        { label: 'EVENTS NEAR ME', href: '#events', fg: '#e8ecf7' },
      ],
      searchOpen: this.state.searchOpen,
      openSearch: () => this.setState({ searchOpen: true }),
      closeSearch: () => this.setState({ searchOpen: false, q: '' }),
      noResults: !!q && ALL_DEALS.filter(d => d.name.toLowerCase().includes(q)).length === 0,
      results: (q ? ALL_DEALS.filter(d => d.name.toLowerCase().includes(q) || d.retailer.toLowerCase().includes(q)) : ALL_DEALS.slice(0, 4)).map(d => {
        return {
          name: d.name,
          msrp: d.msrp,
          quotes: [
            { src: d.retailer, price: d.price, bg: d.under ? 'rgba(92,114,216,.1)' : 'transparent', bd: d.under ? LIME : BD, fg: d.under ? LIME : '#fff', labelFg: DIM },
          ],
        };
      }),
      q: this.state.q,
      setQ: (e) => this.setState({ q: e.target.value }),
      resultCount: String(shown.length).padStart(2, '0'),
      underCount: String(shown.filter(d => d.under).length).padStart(2, '0'),
      cats: CATS.map(c => {
        const on = this.state.cat === c.key;
        return {
          ...c,
          count: String(c.key === 'ALL' ? ALL_DEALS.length : ALL_DEALS.filter(d => catOf(d) === c.key).length).padStart(2, '0'),
          pick: () => this.setState({ cat: c.key }),
          bg: on ? 'rgba(92,114,216,.08)' : '#0e1732',
          bd: on ? LIME : 'rgba(232,236,247,.1)',
          countFg: on ? LIME : 'rgba(232,236,247,.55)',
        };
      }),
      sortOpts: [
        { k: 'DEAL', label: 'BEST DEAL' },
        { k: 'LOW', label: 'PRICE ↑' },
        { k: 'HIGH', label: 'PRICE ↓' },
      ],
      sort: srt,
      setSort: (e) => this.setState({ sort: e.target.value, dealPage: 0 }),
      tickerDur: (this.props.tickerSpeed ?? 34) + 's',
      tickerLoop: [{}, {}],
      // Built from the SAME live-patched ALL_DEALS objects the cards below
      // use (via dealTicker()), not separately hardcoded strings.
      tickerItems: [
        { glyph: '●', tone: PURPLE, label: `HYPERIA CITY PRERELEASE IN ${clock[1].v}H ${clock[2].v}M`, url: 'https://www.disneylorcana.com/en-US/product/hyperia-city' },
        dealTicker('aotv-walmart', '▲', RED),
        dealTicker('aotv-bestbuy', '▲', RED),
        dealTicker('hunny-rescue', '◆', LIME),
        dealTicker('hyperia-box-mm', '▲', RED),
      ],
      clock,
      heroShort: `${clock[1].v}H ${clock[2].v}M`,
      heroStats: [
        { k: 'SET', v: 'HYPERIA CITY', c: '#fff' },
        { k: 'PRERELEASE', v: 'OCT 16', c: LIME },
        { k: 'RELEASE', v: 'OCT 23', c: '#fff' },
      ],
      heroSource: 'DISNEY LORCANA',
      hot: HOT_ITEMS.map(h => {
        const on = !!armed[h.slot];
        return { ...h, toggle: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); this.toggle(h.slot); }, ...this.btn(on, '✓ ALERT ARMED', '+ ADD ALERT') };
      }),
      lairs: [
        { slot: 'lair-1', art: 'https://ravensburger.cloud/cms/gallery/lorcana-web/products/s14-hyperia-city/hero-and-background-new/s14_header_still_1920x1080.jpg', name: 'Hyperia City — Booster Box', price: '$143.76' },
        { slot: 'lair-2', art: 'https://ravensburger.cloud/cms/gallery/lorcana-web/products/s14-hyperia-city/hero-and-background-new/s14_header_still_1920x1080.jpg', name: "Hyperia City — Illumineer's Trove", price: '$49.99' },
        { slot: 'lair-3', art: '', name: 'Hyperia City — 2-Player Starter Set', price: '$29.99' },
        { slot: 'lair-4', art: '', name: 'Hyperia City — Playmat (Miguel)', price: '$24.99' },
        { slot: 'lair-5', art: '', name: 'Hyperia City — Playmat (Stitch & Angel)', price: '$24.99' },
      ],
      howShots: [
        { slot: 'how-1', label: 'SECRET LAIR' },
        { slot: 'how-2', label: 'BOOSTER BOXES' },
        { slot: 'how-3', label: 'COMMANDER PRECONS' },
        { slot: 'how-4', label: 'BUNDLES' },
      ],
      steps: [
        { n: '1', t: 'Wizards posts the drop' },
        { n: '2', t: 'You set your price cap' },
        { n: '3', t: 'We poll 4 official sources' },
        { n: '4', t: 'Alert fires — push, SMS, email' },
        { n: '5', t: 'You check out at MSRP' },
      ].map((x, i) => ({ ...x, bg: i === 0 ? FILL : 'rgba(227,192,127,.2)', fg: i === 0 ? INK : DARKINK })),
      armedCount: pad(Object.values(armed).filter(Boolean).length),
      armAll: () => {
        const all = {};
        ALL_DEALS.forEach(d => { all[d.id] = true; });
        EVENTS.forEach(e => { all[e.id] = true; });
        LOCAL.forEach(e => { all[e.id] = true; });
        CONS.forEach(c => { all[c.id] = true; });
        ['hot-1', 'hot-2', 'hot-3'].forEach(k => { all[k] = true; });
        all.hero = true;
        this.setState({ armed: all });
      },
      armHero: () => this.toggle('hero'),
      heroLabel: heroOn ? '✓ ALERT ARMED' : 'ADD ALERT',
      heroBg: heroOn ? 'transparent' : FILL,
      heroFg: heroOn ? LIME : INK,
      heroBd: LIME,
      heroGlow: heroOn ? 'none' : '0 0 26px rgba(92,114,216,.34)',
      filters: FILTERS.map(x => ({
        label: x.label,
        pick: () => this.setState({ filter: x.key }),
        bg: f === x.key ? PURPLE : 'transparent',
        fg: f === x.key ? DARKINK : DIM,
        bd: f === x.key ? PURPLE : BD,
      })),
      deals: shown.slice(dp.start, dp.start + 6).map(d => {
        const on = !!armed[d.id];
        return {
          ...d,
          slot: 'sw-' + d.id,
          spark: spark(d.series),
          priceColor: d.under ? LIME : PURPLE,
          edge: d.under ? LIME : PURPLE,
          chipBg: d.src === 'SL' ? PURPLE : 'rgba(6,11,26,.82)',
          chipFg: d.src === 'SL' ? DARKINK : 'rgba(232,236,247,.8)',
          toggle: () => this.toggle(d.id),
          openHistory: () => this.setState({ history: d.id, hoverIdx: null }),
          target: this.targetOf(d),
          setTarget: (ev) => {
            const v = ev.target.value.replace(/[^0-9.]/g, '');
            this.setState(st => ({ targets: { ...st.targets, [d.id]: v } }));
          },
          ...this.btn(on, '✓ ALERT ARMED', '+ ADD ALERT'),
        };
      }),
      upcoming: EVENTS.slice(up.start, up.start + 6).map(e => {
        const on = !!armed[e.id];
        const tone = e.hot === 2 ? RED : e.hot === 1 ? LIME : DIM;
        return {
          ...e,
          slot: e.id,
          fg: tone,
          bg: e.hot === 2 ? 'rgba(255,154,61,.16)' : 'rgba(6,11,26,.8)',
          bd: e.hot ? tone : BD,
          toggle: () => this.toggle(e.id),
          ...this.btn(on, '✓ ALERT ARMED', '+ ADD ALERT'),
        };
      }),
      zip: this.state.zip,
      setZip: (e) => this.setState({ zip: e.target.value.replace(/[^0-9]/g, '').slice(0, 5) }),
      radii: [25, 50, 100, 250].map(r => ({
        label: r + ' MI',
        pick: () => this.setState({ radius: r }),
        bg: this.state.radius === r ? FILL : 'transparent',
        fg: this.state.radius === r ? INK : DIM,
        bd: this.state.radius === r ? LINE : BD,
      })),
      nearSummary: (() => {
        const n = LOCAL.filter(e => e.dist <= this.state.radius).length;
        const z = this.state.zip.length === 5 ? this.state.zip : '—';
        return n + ' EVENT' + (n === 1 ? '' : 'S') + ' WITHIN ' + this.state.radius + ' MI OF ' + z + ' · UPDATED HOURLY FROM OFFICIAL STORE LOCATOR';
      })(),
      nearby: LOCAL.filter(e => e.dist <= this.state.radius).map(e => {
        const on = !!armed[e.id];
        const tone = e.hot === 2 ? RED : e.hot === 1 ? LIME : PURPLE;
        return {
          ...e,
          dist: e.dist.toFixed(1),
          tone,
          kindBg: e.hot === 2 ? RED : e.hot === 1 ? FILL : PURPLE,
          kindFg: e.hot === 2 ? '#2a1207' : e.hot === 1 ? INK : DARKINK,
          toggle: () => this.toggle(e.id),
          ...this.btn(on, '\u2713 ALERT ARMED', '+ ADD ALERT'),
        };
      }),
      cons: CONS.map(c => {
        const on = !!armed[c.id];
        return { ...c, toggle: () => this.toggle(c.id), ...this.btn(on, '\u2713 ALERT ARMED', '+ ADD ALERT') };
      }),
      watch: WATCH_ITEMS.map(w => {
        if (w.now == null || w.pct == null) {
          return { ...w, now: '—', color: DIM, fill: DIM, ink: '#fff', badge: 'NOT YET CHECKED', delta: w.ago, cta: 'VIEW LISTING →' };
        }
        const hot = w.pct >= 12, at = w.pct === 0, over = w.pct < 0;
        return {
          ...w,
          color: over ? RED : at ? PURPLE : LIME,
          fill: over ? RED : at ? PURPLE : FILL,
          ink: over ? '#2a1207' : at ? DARKINK : INK,
          badge: over ? 'ABOVE MSRP' : at ? 'AT MSRP' : hot ? 'BEST PRICE YET' : 'BELOW MSRP',
          delta: at ? 'MSRP — NO DISCOUNT' : over ? Math.abs(w.pct) + '% OVER MSRP' : w.pct + '% OFF MSRP · SAVE $' + (parseFloat(w.was.slice(1) || 0) - parseFloat(w.now.slice(1) || 0)).toFixed(2),
          cta: over ? 'AVOID — SEE LISTING →' : at ? 'VIEW DROP →' : 'BUY NOW →',
        };
      }),
      ...this.historyVals(),
      next: [
        { i: '01', t: 'Add-to-watchlist flow with price-cap slider' },
        { i: '02', t: 'Lock-screen push + Watch complication' },
        { i: '03', t: 'Source trust rules — what counts as official' },
        { i: '04', t: 'Drop receipts — did I actually get it?' },
      ],
    };
  }
}

window.DCRuntime.mount({ templateId: 'dc-template', rootId: 'dc-root', ComponentClass: Component, props: { tickerSpeed: 90 } });
</script>
<script src="/urgent-ticker.js"></script>
<script src="/push-client.js"></script>
</body>
</html>
