<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCGTracker — Nintendo</title>
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { --tcg-push-accent: #e60012; --tcg-push-accent-ink: #fff; }
  /* 2026-10-08 — new page, new nav item. See nintendo-app.js's header
     comment for why this page exists (first non-TCG product category)
     and why it ships with a manual "track a product" form instead of a
     full searchable catalog: Nintendo's own store couldn't be reached
     from this project's research tools to verify a search mechanism —
     see the project doc. The form below is the honest interim: paste a
     real Nintendo product URL you found yourself, this app tracks it the
     same way it tracks every other retailer listing (scrapeGeneric()). */
  .nint-add-form { display:flex; flex-direction:column; gap:10px; max-width:560px; margin:0 auto 24px; padding:16px; border:1px solid rgba(233,230,223,.14); border-radius:12px; background:rgba(255,255,255,.02); }
  .nint-add-form input[type=text] { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid rgba(233,230,223,.2); background:rgba(0,0,0,.25); color:var(--ink); font-family:inherit; font-size:14px; }
  .nint-add-form button { align-self:flex-start; padding:10px 18px; border-radius:8px; border:none; background:var(--tcg-push-accent); color:var(--tcg-push-accent-ink); font-weight:700; cursor:pointer; }
  .nint-add-form button:disabled { opacity:.5; cursor:default; }
  .nint-add-msg { font-size:13px; min-height:18px; }
  .nint-add-msg.err { color:#ff7a6e; }
  .nint-add-msg.ok { color:#6ee787; }
</style>
</head>
<body data-game="nintendo">
<div id="app">
  <header class="tcg-header" data-tcg-sticky-header>
    <div class="tcg-header-inner" style="position:relative">
      <div class="tcg-brand">
        <span class="tcg-brand-dot"></span>
        <span class="tcg-brand-word">TCGTRACKER</span>
      </div>
      <nav class="tcg-nav" aria-label="Game selector">
<a class="tcg-nav-item" href="/" aria-label="MTG"><img class="tcg-nav-icon" src="icons/mtg.png" alt=""><span class="tcg-nav-tip">MTG</span></a>
<a class="tcg-nav-item" href="/lorcana" aria-label="Lorcana"><img class="tcg-nav-icon" src="icons/lorcana.png" alt=""><span class="tcg-nav-tip">Lorcana</span></a>
<a class="tcg-nav-item" href="/pokemon" aria-label="Pokémon"><img class="tcg-nav-icon" src="icons/pokemon.png" alt=""><span class="tcg-nav-tip">Pokémon</span></a>
<a class="tcg-nav-item active" href="/nintendo" aria-label="Nintendo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 2a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h2V2H7zm10 0h-2v20h2a5 5 0 0 0 5-5V7a5 5 0 0 0-5-5zM7 15a1.75 1.75 0 1 1 0-3.5A1.75 1.75 0 0 1 7 15zm10-4a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zm-2.5 2.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zm5 0a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zm-2.5-5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z" fill="currentColor"></path></svg><span class="tcg-nav-tip">Nintendo</span></a>
<a class="tcg-nav-item" href="/heads-up" aria-label="Heads Up"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"></path></svg><span class="tcg-nav-tip">Heads Up</span></a>
</nav>
    </div>
  </header>

  <section class="info-section" style="padding-top:20px">
    <p class="info-note">Hardware, accessories, and anything else from Nintendo's own store — same real-time restock alerts as every other game/retailer here, just not a trading card. This is the first non-TCG category in this app; <a href="#nint-add" style="color:inherit;text-decoration:underline">add a product below</a> to start tracking it.</p>
  </section>

  <section id="nint-add" style="padding:0 20px">
    <form class="nint-add-form" id="nintAddForm">
      <label for="nintAddUrl" style="font-weight:700;font-size:14px">Track a Nintendo Store product</label>
      <input type="text" id="nintAddUrl" placeholder="https://www.nintendo.com/us/store/products/..." required>
      <input type="text" id="nintAddName" placeholder="Short name for this product (e.g. “Zelda 40th Pro Controller Stand”)" required>
      <button type="submit" id="nintAddBtn">Track this product</button>
      <div class="nint-add-msg" id="nintAddMsg"></div>
    </form>
  </section>

  <main id="nintendoGrid" class="grid" style="padding:0 20px 40px"></main>
</div>
<script src="/nintendo-app.js"></script>
<script src="/push-client.js"></script>
</body>
</html>
